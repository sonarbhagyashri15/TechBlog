<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport",content="width=device-width, initial-scale=1.0">
<title>Create Blog | TechBlog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
background:#f0fdfa;
}
.header{
background:#ffffff;
border-bottom:3px solid #6366f1;
padding:20px 40px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}
.logo{
font-size:28px;
font-weight:700;
color:#2563eb;
}
.logo i{
margin-right:8px;
}
.back-btn{
background:#2563eb;
color:white;
padding:10px 22px;
border-radius:8px;
text-decoration:none;
font-weight:500;
transition:.3s;
}
.back-btn:hover{
background:#1d4ed8;
color:white;
}
.main{
padding:50px 0;
}
.card{
background:#f8fbff;
border:1px solid #dbeafe;
border-radius:20px;
box-shadow:0 10px 25px rgba(37,99,235,.10);
}
.card-header{
background:#eff6ff;
border-bottom:1px solid #dbeafe;
padding:25px 35px;
}
.card-header h3{
margin:0;
font-weight:700;
color:#0f172a;
}
.card-body{
padding:35px;
}
.form-label{
font-weight:600;
color:#334155;
}
.form-control{
height:52px;
background:#ffffff;
border:1px solid #cbd5e1;
border-radius:10px;
}
textarea.form-control{
min-height:500px;
width:100%;
padding:18px;
font-size:16px;
line-height:1.8;
border:1px solid #dbe2ea;
border-radius:12px;
resize:vertical;
}
.form-control:focus{
border-color:#2563eb;
box-shadow:0 0 8px rgba(37,99,235,.15);
}
</style>
</head>
<body>
<div class="header">
<div class="logo">
<i class="fa-solid fa-laptop-code"></i>
TechBlog
</div>
<a href="{% url 'admin_dashboard' %}"
class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
Dashboard
</a>
</div>
<div class="container main">
<div class="row justify-content-center">
<div class="col-lg-13">
<div class="card">
<div class="card-header">
<h3>
<i class="fa-solid fa-pen-to-square"></i>
Create New Blog
</h3>
</div>
<div class="card-body">
<form method="POST">
{% csrf_token %}
<div class="row">
    <div class="col-md-6 mb-4">
        <label class="form-label">
            <i class="fa-solid fa-heading text-primary"></i>
            Blog Title
        </label>
        {{ form.title }}
    </div>
    <div class="col-md-6 mb-4">
        <label class="form-label">
            <i class="fa-solid fa-user text-primary"></i>
            Author
        </label>
        {{ form.author }}
    </div>
    <div class="col-12 mb-4">
        <label class="form-label">
            <i class="fa-solid fa-tags text-primary"></i>
            Tags
        </label>
        {{ form.tags }}
        <small class="text-muted">
            Example: Python, Django, AI, Java
        </small>
    </div>
    <div class="col-12 mb-4">
        <label class="form-label">
            <i class="fa-solid fa-file-lines text-primary"></i>
            Blog Content
        </label>
        {{ form.content }}
    </div>
</div>
<div class="d-flex justify-content-end gap-3 mt-4">
    <button type="reset" class="btn btn-outline-secondary px-4">
        <i class="fa-solid fa-rotate-left"></i>
        Reset
    </button>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-danger px-4">
        <i class="fa-solid fa-xmark"></i>
        Cancel
    </a>
    <button type="submit" class="btn btn-primary px-4">
        <i class="fa-solid fa-paper-plane"></i>
        Publish Blog
    </button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
