<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechBlog | Register</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.container{
background:#111827;
padding:40px;
border-radius:20px;
width:420px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.logo{
text-align:center;
margin-bottom:20px;
}

.logo i{
font-size:55px;
color:#60a5fa;
}

.logo h2{
margin-top:10px;
color:#60a5fa;
font-weight:bold;
}

.logo p{
color:#cbd5e1;
}

.input-box{
position:relative;
margin-bottom:20px;
}

.input-box input{
width:100%;
padding:12px 40px;
background:#1e293b;
border:none;
border-radius:8px;
font-size:15px;
outline:none;
color:white;
}

.input-box input:focus{
background:#1e293b;
border:1px solid #3b82f6;
}
.input-box i{
position:absolute;
left:12px;
top:14px;
color:#94a3b8;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

.login{
text-align:center;
margin-top:20px;
color:#cbd5e1;
}

.login a{
text-decoration:none;
color:#60a5fa;
font-weight:bold;
}

.login a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
<i class="fa-solid fa-laptop-code"></i>
<h2>Create Account</h2>
<p>Join TechBlog Community</p>
</div>

<form method="POST">

{% csrf_token %}

<div class="input-box">
<i class="fa fa-user"></i>
<input type="text" name="username" placeholder="Username" required>
</div>

<div class="input-box">
<i class="fa fa-envelope"></i>
<input type="email" name="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" name="password1" placeholder="Password" required>
</div>

<div class="input-box">
<i class="fa fa-lock"></i>
<input type="password" name="password2" placeholder="Confirm Password" required>
</div>

<button type="submit">
<i class="fa fa-user-plus"></i> Register
</button>

</form>

<div class="login">
Already have an account?
<a href="{% url 'login' %}">Login</a>
</div>

</div>

</body>
</html>
