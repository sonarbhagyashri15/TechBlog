<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Users | TechBlog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
background:#f4f7fc;
}
.sidebar{
width:250px;
height:100vh;
position:fixed;
left:0;
top:0;
background:#0f172a;
padding-top:20px;
}
.sidebar h3{
color:white;
text-align:center;
margin-bottom:35px;
font-weight:bold;
}
.sidebar a{
display:block;
padding:15px 25px;
color:#cbd5e1;
text-decoration:none;
transition:.3s;
}
.sidebar a:hover,
.sidebar .active{
background:#2563eb;
color:white;
}
.main{
margin-left:250px;
padding:35px;
}
.page-title{
font-size:32px;
font-weight:700;
color:#0f172a;
margin-bottom:25px;
}
.table-box{
background:white;
padding:30px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}
.table{
margin-bottom:0;
}
.table thead{
background:#0f172a;
color:white;
}
.table th,
.table td{
vertical-align:middle;
padding:15px;
}
.table tbody tr:hover{
background:#f8fbff;
}
.btn-delete{
background:#dc2626;
color:white;
border-radius:8px;
padding:8px 16px;
text-decoration:none;
}
.btn-delete:hover{
background:#b91c1c;
color:white;
}
.badge-user{
background:#2563eb;
color:white;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}
@media(max-width:768px){
.sidebar{
width:100%;
height:auto;
position:relative;
}
.main{
margin-left:0;
}
.table-responsive{
overflow-x:auto;
}
}
</style>
</head>
<body>
<div class="sidebar">
<h3>
<i class="fa-solid fa-laptop-code"></i>
TechBlog
</h3>
<a href="{% url 'admin_dashboard' %}">
<i class="fa-solid fa-chart-line"></i>
Dashboard
</a>
<a href="{% url 'create_blog' %}">
<i class="fa-solid fa-plus"></i>
Add Blog
</a>
<a href="{% url 'manage_blogs' %}">
<i class="fa-solid fa-book-open"></i>
Manage Blogs
</a>
<a href="{% url 'manage_users' %}" class="active">
<i class="fa-solid fa-users"></i>
Manage Users
</a>
<a href="{% url 'home' %}">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>
</div>
<div class="main">
<h2 class="page-title">
<i class="fa-solid fa-users"></i>
Manage Users
</h2>
<div class="table-box">
<div class="table-responsive">
<table class="table table-hover align-middle">
<thead>
<tr>
<th>ID</th>
<th>Username</th>
<th>Email</th>
<th>Date Joined</th>
<th>Action</th>
</tr>
</thead>
<tbody>
{% for user in users %}
<tr>
<td>{{ user.id }}</td>
<td>
<strong>{{ user.username }}</strong>
</td>
<td>{{ user.email }}</td>
<td>{{ user.date_joined|date:"d M Y" }}</td>
<td>
<a href="{% url 'delete_user' user.id %}"
class="btn-delete">
<i class="fa-solid fa-trash"></i>
Delete
</a>
</td>
</tr>
{% empty %}
<tr>
<td colspan="6" class="text-center">
No Users Found
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
</div>
</body>
</html>
