<html>
<head>
<title>TechBlog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{
background:#0b1120;
font-family:'Poppins',sans-serif;
}
.navbar{
background:#111827;
padding:18px 0;
box-shadow:0 5px 20px rgba(0,0,0,.4);
}
.navbar-brand{
font-size:30px;
font-weight:700;
color:#60a5fa !important;
}
.container{
max-width:1250px;
}
.btn{
border-radius:10px;
font-weight:600;
padding:10px 22px;
transition:.3s;
}
.btn-light{
background:#2563eb;
border:none;
color:white;
}
.btn-light:hover{
background:#1d4ed8;
color:white;
}
.btn-warning{
background:#7c3aed;
border:none;
color:white;
}
.btn-warning:hover{
background:#6d28d9;
color:white;
}
.btn-danger{
background:#dc2626;
border:none;
}
.btn-danger:hover{
background:#b91c1c;
}
.card{
background:#111827;
border:1px solid #1f2937;
border-radius:20px;
color:white;
transition:.3s;
box-shadow:0 8px 25px rgba(0,0,0,.35);
}
.card:hover{
transform:translateY(-6px);
border-color:#3b82f6;
}
.card-title{
color:#60a5fa;
font-weight:700;
}
.card-text{
color:#cbd5e1;
}
.badge{
background:#2563eb !important;
font-size:14px;
padding:8px 14px;
border-radius:30px;
}
.pagination .page-link{
background:#111827;
border:1px solid #1f2937;
color:#60a5fa;
}
.pagination .page-link:hover{
background:#2563eb;
color:white;
}
.pagination .active .page-link{
background:#2563eb;
border-color:#2563eb;
}
hr{
border-color:#1f2937;
}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
<div class="container">
<a class="navbar-brand" href="/posts/list/">
<i class="fa-solid fa-laptop-code me-2"></i> TechBlog
</a>
<div>

<a href="/posts/create/" class="btn btn-light me-2">
➕ Create Blog
</a>
<a href="/posts/list/" class="btn btn-warning">
📚 All Blogs
</a>
<a href="{% url 'home' %}" class="btn btn-danger">
    Logout
</a>
</div>
</div>
</nav>
<div class="container mt-5">
{% block content %}
{% endblock %}
</div>
</body>
</html>
