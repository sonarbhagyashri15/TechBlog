<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Blogs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{
background:#f4f7fc;
font-family:Arial,sans-serif;
}
.sidebar{
width:250px;
height:100vh;
position:fixed;
background:#0f172a;
padding-top:20px;
}
.sidebar h3{
color:white;
text-align:center;
margin-bottom:30px;
}
.sidebar a{
display:block;
color:#cbd5e1;
padding:15px 25px;
text-decoration:none;
}
.sidebar a:hover{
background:#2563eb;
color:white;
}
.main{
margin-left:250px;
padding:30px;
}
.table-box{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}
.btn-edit{
background:#f59e0b;
color:white;
}
.btn-delete{
background:#dc2626;
color:white;
}
</style>

</head>
<body>
<div class="sidebar">
<h3>TechBlog Admin</h3>
<a href="{% url 'admin_dashboard' %}">
<i class="fa fa-chart-line"></i> Dashboard
</a>
<a href="{% url 'create_blog' %}">
<i class="fa fa-plus"></i> Add Blog
</a>
<a href="{% url 'manage_blogs' %}">
<i class="fa fa-book"></i> Manage Blogs
</a>
<a href="{% url 'manage_users' %}">
<i class="fa fa-users"></i> Manage Users
</a>
<a href="{% url 'home' %}">
<i class="fa fa-right-from-bracket"></i> Logout
</a>
</div>
<div class="main">
<div class="table-box">
<h2 class="mb-4">
<i class="fa-solid fa-book-open"></i>
Manage Blogs
</h2>
<table class="table table-hover">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Title</th>
<th>Edit</th>
<th>Delete</th>
</tr>
</thead>
<tbody>
{% for blog in blogs %}
<tr>
<td>{{ blog.id }}</td>
<td>{{ blog.title }}</td>
<td>
<a href="{% url 'edit_blog' blog.id %}"
class="btn btn-edit btn-sm">
Edit
</a>
</td>
<td>
<a href="{% url 'delete_blog' blog.id %}"
class="btn btn-delete btn-sm">
Delete
</a>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
</body>
</html>
