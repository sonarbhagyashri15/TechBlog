<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{
background:#f4f7fc;
font-family:Arial,sans-serif;
}
.sidebar{
width:250px;
height:100vh;
position:fixed;
background:#0f172a;
padding-top:20px;
}
.sidebar h3{
color:white;
text-align:center;
margin-bottom:30px;
}
.sidebar a{
display:block;
color:#cbd5e1;
padding:15px 25px;
text-decoration:none;
transition:.3s;
}
.sidebar a:hover{
background:#2563eb;
color:white;
}
.main{
margin-left:250px;
padding:30px;
}
.card-box{
border:none;
border-radius:15px;
padding:20px;
color:white;
}
.bg1{background:#2563eb;}
.bg2{background:#16a34a;}
.action-card{
background:white;
border-radius:15px;
padding:25px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}
.action-card:hover{
transform:translateY(-5px);
}
.action-card i{
font-size:40px;
margin-bottom:15px;
color:#2563eb;
}
</style>
</head>
<body>
<div class="sidebar">
<h3>TechBlog Admin</h3>
<a href="{% url 'admin_dashboard' %}">
<i class="fa fa-chart-line"></i> Dashboard
</a>
<a href="{% url 'admin_createblog' %}">
<i class="fa fa-plus"></i> Add Blog
</a>
<a href="{% url 'manage_blogs' %}"><i class="fa fa-book"></i> Manage Blogs
</a>
<a href="{% url 'manage_users' %}">
<i class="fa-solid fa-users"></i> Manage Users
</a>
<a href="{% url 'home' %}">
<i class="fa fa-right-from-bracket"></i> Logout
</a>
</div>
<div class="main">
<h2 class="mb-4">
Welcome Admin 👋
</h2>
<div class="row mb-4">
<div class="col-md-6">
<div class="card-box bg1">
<h3>{{ total_blogs }}</h3>
<p>Total Blogs</p>
</div>
</div>
<div class="col-md-6">
<div class="card-box bg2">
<h3>{{ total_users }}</h3>
<p>Total Users</p>
</div>
</div>
</div>
<div class="row">
<div class="col-md-4">
<a href="{% url 'admin_createblog' %}" class="text-decoration-none">
<div class="action-card">
<i class="fa fa-plus-circle"></i>
<h5>Add Blog</h5>
</div>
</a>
</div>
<div class="col-md-4">
<a href="{% url 'manage_blogs' %}" class="text-decoration-none">
<div class="action-card">
<i class="fa fa-book-open"></i>
<h5>Manage Blogs</h5>
</div>
</a>
</div>
<div class="col-md-4">
<a href="{% url 'manage_users' %}" class="text-decoration-none">
<div class="action-card">
<i class="fa-solid fa-users"></i>
<h5>Manage Users</h5>
</div>
</a>
</div>
<div class="col-md-4">
<a href="{% url 'home' %}" class="text-decoration-none">
<div class="action-card">
<i class="fa fa-right-from-bracket"></i>
<h5>Logout</h5>
</div>
</a>
</div>
</div>
</div>
</body>
</html>
