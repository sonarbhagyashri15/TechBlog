<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | TechBlog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}
body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.login-box{
background:#111827;
padding:40px;
border-radius:20px;
width:420px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.login-box h2{
text-align:center;
color:#60a5fa;
margin-bottom:30px;
font-weight:bold;
}
.form-control{
background:#1e293b;
border:none;
color:white;
padding:12px;
}
.form-control:focus{
background:#1e293b;
color:white;
box-shadow:none;
border:1px solid #3b82f6;
}
.btn-login{
width:100%;
background:#2563eb;
color:white;
padding:12px;
font-weight:bold;
border-radius:10px;
}
.btn-login:hover{
background:#1d4ed8;
color:white;
}
.back{
text-align:center;
margin-top:20px;
}
.back a{
color:#60a5fa;
text-decoration:none;
}
.alert{
font-size:14px;
}
</style>
</head>
<body>
<div class="login-box">
<h2>
<i class="fa-solid fa-user-shield"></i>
Admin Login
</h2>
{% if messages %}
{% for message in messages %}
<div class="alert alert-danger">
{{ message }}
</div>
{% endfor %}
{% endif %}
<form method="POST">
{% csrf_token %}
<div class="mb-3">
<input type="text"
name="username"
class="form-control"
placeholder="Admin Username"
required>
</div>
<div class="mb-3">
<input type="password"
name="password"
class="form-control"
placeholder="Password"

required>

</div>

<button class="btn btn-login">

<i class="fa-solid fa-right-to-bracket"></i>

Login

</button>

</form>

<div class="back">

<a href="/">

<i class="fa-solid fa-arrow-left"></i>

Back to Home

</a>

</div>

</div>

</body>

</html>
